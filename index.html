<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ray's Couriers - Freight Forwarding & Mailbox System</title>
    <meta
      name="description"
      content="Production-ready courier, freight forwarding, and mailbox management web application featuring customer shipping portals, Miami warehouse intake, package release queue, POS cash cashier, and admin operations."
    />
    <meta property="og:title" content="Ray's Couriers - Freight Forwarding & Mailbox System" />
    <meta
      property="og:description"
      content="Production-ready courier, freight forwarding, and mailbox management web application featuring customer shipping portals, Miami warehouse intake, package release queue, POS cash cashier, and admin operations."
    />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" type="image/png" href="/assets/logo.png" />
    <link rel="stylesheet" crossorigin href="/assets/target.css" />
    <link rel="stylesheet" id="fonts-code" href="/assets/fonts-code.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <script>
      (function () {
        const redirect = new URLSearchParams(location.search).get('redirect');
        if (redirect && redirect !== location.pathname) {
          history.replaceState(null, '', redirect);
        }
      })();
    </script>
  </head>
  <body class="bg-slate-50 text-slate-900 antialiased font-sans m-0 p-0">
    <div id="root"></div>
    <script id="md-click">
      window.mdClick = e => {
        const target = e.target;
        const {href, target: linkTarget} = target.dataset || {};
        const appType = 'web';
        const isBlank = linkTarget === '_blank';
        if (!href) return;
        e.stopPropagation();
        e.preventDefault();
        if (isBlank || href.startsWith('http')) {
          let finalHref = href;
          if (appType === 'miniapp' && !href.startsWith('http')) {
            finalHref = window.location.href.split('#')[0] + '#/' + href;
          }
          window.open(finalHref, linkTarget || '_self');
          return;
        }
        const finalHref = href.startsWith('/') ? href : '/' + href;
        if (appType === 'miniapp') {
          window.location.hash = finalHref;
          window.dispatchEvent(new HashChangeEvent('hashchange'));
        } else {
          window.history.pushState({}, '', finalHref);
          window.dispatchEvent(new Event('popstate'));
        }
      };
      document.addEventListener('click', window.mdClick, true);
    </script>
    <script src="/assets/mock-db.js"></script>
    <script src="/assets/camera-scanner.js"></script>
    <script type="module" crossorigin src="/assets/app.bundle.js"></script>
  </body>
</html>
